services:
  - type: web
    name: elise
    runtime: node
    plan: free
    buildCommand: cd backend && npm ci && npm run build && cd ../frontend && npm ci && npm run build
    startCommand: node backend/dist/main.js
    healthCheckPath: /api/chat/status
    envVars:
      - key: NODE_ENV
        value: production
      # Clé Anthropic : à saisir dans le dashboard Render (Sync -> ne pas commiter)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-haiku-4-5-20251001
      # URL publique du frontend (même domaine que le backend => CORS inutile)
      - key: FRONT_URL
        value: https://elise.onrender.com
